[package]
name = "openfuse-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
hid = ["openfuse-device/hid"]

[dependencies]
openfuse-core.workspace = true
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json.workspace = true
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openfuse-device = { path = "../openfuse-device" }
openfuse-audio = { path = "../openfuse-audio" }
rfd = "0.15.4"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSNotification", "NSAppleEventDescriptor", "NSAppleEventManager", "objc2-core-services"] }
