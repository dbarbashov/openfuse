[workspace]
members = ["crates/openfuse-core", "crates/openfuse-cli", "crates/openfuse-desktop", "crates/openfuse-device", "crates/openfuse-audio"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openfuse-core = { path = "crates/openfuse-core" }
