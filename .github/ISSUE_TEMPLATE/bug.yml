name: Application bug
description: A reproducible editor, file, playback or UI problem
body:
  - type: input
    id: version
    attributes: {label: Version or commit}
    validations: {required: true}
  - type: input
    id: platform
    attributes: {label: OS and architecture}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps and expected / actual behavior}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes:
      label: Logs or minimal example
      description: Use synthetic or redacted files. Do not upload original Fender binaries, firmware, private presets or secrets.
