name: Portable packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux audio, HID and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libxkbcommon-dev libxkbcommon-x11-0 xvfb libgl1-mesa-dri
      - run: python -m unittest discover -s packaging/tests -v
      - name: Parse explicit Windows association helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content -Raw packaging/windows/register-file-type.ps1))'
      - name: Install Universal macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Package macOS Universal
        if: runner.os == 'macOS'
        run: python tools/package_release.py --universal --output "${{ runner.temp }}/openfuse-distribution"
      - name: Package Windows and Linux
        if: runner.os != 'macOS'
        run: python tools/package_release.py --output "${{ runner.temp }}/openfuse-distribution"
      - name: Linux graphical launch
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a timeout 90 target/x86_64-unknown-linux-gnu/release/openfuse-desktop --demo --screenshot ${{ runner.temp }}/openfuse-distribution/linux-editor.png
          test -s ${{ runner.temp }}/openfuse-distribution/linux-editor.png
      - uses: actions/upload-artifact@v4
        with:
          name: openfuse-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/openfuse-distribution/*.dmg
            ${{ runner.temp }}/openfuse-distribution/*.tar.gz
            ${{ runner.temp }}/openfuse-distribution/*.zip
            ${{ runner.temp }}/openfuse-distribution/release-manifest.json
            ${{ runner.temp }}/openfuse-distribution/SHA256SUMS
            ${{ runner.temp }}/openfuse-distribution/*.png
          if-no-files-found: error
          retention-days: 30
